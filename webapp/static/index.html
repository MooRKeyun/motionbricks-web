<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MotionBricks · Web 3D 起止状态补间</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="hud">
    <header>
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>MotionBricks 3D 补间</h1>
          <p>在场景中指定起点与终点，由模型生成中间动作</p>
        </div>
      </div>
      <div id="status">
        <div class="status-row">
          <span id="status-text">正在连接……</span>
          <span id="status-badge" class="badge">启动中</span>
        </div>
        <div class="progress"><div id="status-bar"></div></div>
      </div>
    </header>

    <aside id="panel">
      <section class="card" data-target="start">
        <div class="card-head">
          <h2><i class="swatch start"></i>起点状态</h2>
          <button class="ghost-btn edit-btn" data-target="start">在场景中移动</button>
        </div>
        <label class="field">
          <span>姿态</span>
          <select id="start-pose"></select>
        </label>
        <div class="row">
          <label class="field">
            <span>X</span>
            <input id="start-x" type="number" step="0.1" value="0" />
          </label>
          <label class="field">
            <span>Y</span>
            <input id="start-y" type="number" step="0.1" value="0" />
          </label>
        </div>
        <label class="field">
          <span>朝向 <b id="start-heading-label">0°</b></span>
          <input id="start-heading" type="range" min="-180" max="180" step="1" value="0" />
        </label>
      </section>

      <section class="card" data-target="end">
        <div class="card-head">
          <h2><i class="swatch end"></i>终点状态</h2>
          <button class="ghost-btn edit-btn" data-target="end">在场景中移动</button>
        </div>
        <label class="field">
          <span>姿态</span>
          <select id="end-pose"></select>
        </label>
        <div class="row">
          <label class="field">
            <span>X</span>
            <input id="end-x" type="number" step="0.1" value="2.4" />
          </label>
          <label class="field">
            <span>Y</span>
            <input id="end-y" type="number" step="0.1" value="0" />
          </label>
        </div>
        <label class="field">
          <span>朝向 <b id="end-heading-label">0°</b></span>
          <input id="end-heading" type="range" min="-180" max="180" step="1" value="0" />
        </label>
      </section>

      <section class="card">
        <h2>生成参数</h2>
        <label class="field">
          <span>节奏</span>
          <select id="pace">
            <option value="fast">快（走/小跑）</option>
            <option value="normal" selected>自然</option>
            <option value="slow">慢（长过渡）</option>
          </select>
        </label>
        <label class="field">
          <span>单段距离 <b id="step-label">1.0 m</b></span>
          <input id="step" type="range" min="0.5" max="2" step="0.1" value="1" />
        </label>
        <button id="generate" class="primary" disabled>生成中间动作</button>
        <p id="hint" class="hint">首次启动需构建 TensorRT 引擎，约 1–3 分钟。</p>
      </section>

      <section class="card stats" id="stats-card">
        <h2>结果</h2>
        <dl>
          <div><dt>分段</dt><dd id="stat-segments">—</dd></div>
          <div><dt>时长</dt><dd id="stat-duration">—</dd></div>
          <div><dt>帧数</dt><dd id="stat-frames">—</dd></div>
          <div><dt>推理</dt><dd id="stat-inference">—</dd></div>
          <div><dt>终点误差</dt><dd id="stat-error">—</dd></div>
        </dl>
        <button id="export" class="ghost-btn wide" disabled>导出带动画的 GLB</button>
      </section>
    </aside>

    <footer id="timeline">
      <button id="play" class="icon-btn" disabled>▶</button>
      <span id="time-label">0.00 s / 0.00 s</span>
      <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" disabled />
      <label class="check"><input id="loop" type="checkbox" /> 循环</label>
      <span class="spacer"></span>
      <span class="legend"><i class="swatch start"></i>起点</span>
      <span class="legend"><i class="swatch end"></i>终点</span>
    </footer>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
